name: ERP checks

on:
  pull_request:
    paths:
      - "erp/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/erp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp/package-lock.json
      - name: Install dependencies
        working-directory: erp
        run: npm ci
      - name: Test and build
        working-directory: erp
        run: npm run build
      - name: Verify committed bundle is current
        run: git diff --exit-code -- erp/assets/app.js
      - name: Test private legacy-import tooling
        working-directory: erp/tools
        run: npm test
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Check staff Edge Function
        working-directory: erp/supabase/functions/manage-staff
        run: deno check --frozen index.ts
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Apply migrations to an isolated local database
        working-directory: erp
        run: supabase db start
      - name: Run database security tests
        working-directory: erp
        run: supabase test db
